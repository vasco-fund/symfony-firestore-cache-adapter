name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        symfony: ['7.4.*', '8.0.*']
        exclude:
          - php: 8.2
            symfony: '8.0.*'
          - php: 8.3
            symfony: '8.0.*'

    services:
      firestore:
        image: ehacke/firestore-emulator:2.0.1
        ports:
          - 8080:8080
        env:
          GCP_PROJECT: test-project

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json, gzip
          coverage: pcov
          tools: composer:v2

      - name: Start Firestore Emulator
        run: |
          docker run -d -p 8080:8080 \
            -e FIRESTORE_PROJECT_ID=test-project \
            google/cloud-sdk:emulators \
            gcloud beta emulators firestore start --host-port=0.0.0.0:8080
          sleep 10

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: |
          composer require symfony/cache:${{ matrix.symfony }} --no-update
          composer install --prefer-dist --no-progress --no-suggest

      - name: Run unit tests
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          GOOGLE_CLOUD_PROJECT: test-project
        run: vendor/bin/phpunit

      - name: Generate coverage report
        if: matrix.php == '8.4' && matrix.symfony == '7.4.*'
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          GOOGLE_CLOUD_PROJECT: test-project
        run: vendor/bin/phpunit --coverage-text

  phpstan:
    name: PHPStan Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, json
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan
        run: composer phpstan

  code-style:
    name: Code Style Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check code style
        run: composer cs:check

  mutation-testing:
    name: Mutation Testing
    runs-on: ubuntu-latest
    continue-on-error: true

    services:
      firestore:
        image: google/cloud-sdk:emulators
        ports:
          - 8080:8080

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, pcov
          coverage: pcov

      - name: Start Firestore Emulator
        run: |
          docker run -d -p 8080:8080 \
            -e FIRESTORE_PROJECT_ID=test-project \
            google/cloud-sdk:emulators \
            gcloud beta emulators firestore start --host-port=0.0.0.0:8080
          sleep 10

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run Infection
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          GOOGLE_CLOUD_PROJECT: test-project
        run: composer infection || true
